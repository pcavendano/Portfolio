name: Deploy Portfolio to Digital Ocean

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to droplet
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DO_DROPLET_IP }}
          username: ${{ secrets.DO_SSH_USER }}
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          script: |
            SERVE_DIR="/home/ploi/pcavendano.com/dist"
            PROJECT_DIR="/home/root/portfolio"
            mkdir -p "$PROJECT_DIR"

            # Archive current site as v1 (only if v1 doesn't exist yet)
            if [ ! -d "$SERVE_DIR/v1" ] && [ -f "$SERVE_DIR/index.html" ]; then
              echo "Archiving current site as v1..."
              mkdir -p "$SERVE_DIR/v1"
              cp -r "$SERVE_DIR"/* "$SERVE_DIR/v1/" 2>/dev/null || true
              rm -rf "$SERVE_DIR/v1/v1"
            fi

            if [ ! -d "$PROJECT_DIR/.git" ]; then
              git clone https://github.com/${{ github.repository }}.git "$PROJECT_DIR"
            fi

            cd "$PROJECT_DIR"
            git fetch origin main
            git reset --hard origin/main

            # Install and build
            npm ci
            npm run build

            # Deploy built files to Ploi serve directory (preserve v1)
            find "$SERVE_DIR" -maxdepth 1 -not -name 'v1' -not -path "$SERVE_DIR" -exec rm -rf {} +
            cp -r dist/* "$SERVE_DIR/"

            echo "Portfolio deploy complete!"
